# Caimón web tier: serves the SPA and proxies /api to the API service on the
# same origin, so cookies (session + CSRF) and WebSockets need no cross-origin
# handling at all.

# WebSocket upgrade plumbing. Build logs and Admin → Deploy logs stream over
# `wss://caimon.raidpr.com/api/...`; without passing Upgrade/Connection through,
# those requests come back as plain 200s and the UI silently falls back to
# polling. conf.d/* is included inside the http block, so `map` is legal here.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the API upstream via Docker's embedded DNS at REQUEST time, not at
  # config load. With a literal `proxy_pass http://api:4000`, nginx resolves
  # "api" on startup and exits with [emerg] "host not found in upstream" when
  # the API service isn't registered yet — and Swarm ignores depends_on, so web
  # regularly boots first. The variable defers the lookup and re-resolves every
  # `valid=` window, which also survives an api task restart onto a new VIP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:4000;

  # Certificate/keystore uploads are base64 in a JSON body; the API's own
  # bodyLimit is 10 MB, so this is headroom, not a second policy.
  client_max_body_size 64m;

  # SPA: static assets, then index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin proxy to the API service.
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;

    # Build and deploy logs are long-lived streams that can sit idle between
    # lines; nginx's 60s default would cut them mid-build.
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    # Log streams must arrive line by line, not in buffered chunks.
    proxy_buffering off;
  }
}
