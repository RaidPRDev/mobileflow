server {
    listen 80;
    server_name xbuilds.raidpr.com;

    root /usr/share/nginx/html;

    location / {
        # No directory listings — artifacts are only reachable by their exact
        # (UUID-based) URL handed out by MobileFlow.
        autoindex off;

        # Allow direct file downloads
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream aab;
        }

        # CORS headers for downloads
        add_header Access-Control-Allow-Origin 'https://caimon.raidpr.com' always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
    }
}
